name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync runtime content to public/data
        run: npm run sync:data

      - name: Validate content invariants
        run: npm run validate:content

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (fast suite)
        run: npm run test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build CC0 atlases and audio
        run: npm run build:assets

      - name: Asset CC0 audit
        run: npm run audit:assets

      - name: Production build
        run: npm run build

      - name: Bundle size gate
        run: npm run size:check

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync runtime content to public/data
        run: npm run sync:data

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Headless browser smoke tests
        run: npm run test:e2e
        env:
          CI: true
