# Cloudflare Workers Static Assets — static SPA/PWA (no Worker script).
#
# Git-connected deploy: Cloudflare detects wrangler.toml and classifies this as a
# Worker project. Set Build command to `npm run build` and Deploy command to
# `npx wrangler deploy`. Assets are published from ./dist via [assets] below.
#
# SPA routing uses not_found_handling (not _redirects). Static files under
# /assets/* and /data/* are served when they exist; other paths get index.html.
#
# Cache headers: public/_headers is copied to dist/_headers at build time and
# is honored by Workers Static Assets (see Cloudflare docs on custom headers).

name = "vals_kitchen"
compatibility_date = "2026-07-24"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
